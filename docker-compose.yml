services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: nckh_neo4j
    environment:
      - NEOX_AUTH=neo4j/nckh_ctdlgt_2026
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j-init:
    # service nạp dữ liệu sẽ tự động đợi neo4j chạy khỏe hẳn (healthy) mới bắt đầu chạy
    depends_on:
      neo4j:
        condition: service_healthy
    # ... phần cấu hình init tiếp theo của Nam
